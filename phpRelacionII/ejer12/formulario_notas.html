<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cálculo de calificación</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2 class="text-center mb-4">Cálculo de Calificación</h2>

<form action="resultado_notas.php" method="POST" class="card p-4 shadow">

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" name="correo" class="form-control" required>
    </div>

    <div class="row">
        <div class="col-md-3">
            <label>Inicial</label>
            <input type="number" name="n1" class="form-control" required min="0" max="10">
        </div>
        <div class="col-md-3">
            <label>Primera</label>
            <input type="number" name="n2" class="form-control" required min="0" max="10">
        </div>
        <div class="col-md-3">
            <label>Segunda</label>
            <input type="number" name="n3" class="form-control" required min="0" max="10">
        </div>
        <div class="col-md-3">
            <label>Tercera</label>
            <input type="number" name="n4" class="form-control" required min="0" max="10">
        </div>
    </div>

    <button class="btn btn-primary w-100 mt-3">Calcular</button>
</form>

</body>
</html>
