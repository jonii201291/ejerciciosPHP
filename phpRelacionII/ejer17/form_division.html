<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
<form id="form" action="division.php" method="POST" class="card p-4">

    <div class="mb-3">
        <label>Dividendo</label>
        <input type="number" class="form-control" name="a" required min="1">
    </div>

    <div class="mb-3">
        <label>Divisor</label>
        <input type="number" class="form-control" name="b" required min="1">
    </div>

    <label class="form-label">Calcular:</label>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="calc[]" value="cociente">
        <label>Cociente</label>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="calc[]" value="resto">
        <label>Resto</label>
    </div>

    <button class="btn btn-primary w-100">Enviar</button>
</form>
</div>

<script>
document.getElementById("form").onsubmit = e => {
    if (document.querySelectorAll("input[type=checkbox]:checked").length === 0) {
        alert("Selecciona al menos una opción");
        e.preventDefault();
    }
};
</script>
