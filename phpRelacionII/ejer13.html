<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>Validación con JavaScript</h2>

<form id="formNotas" action="resultado_notas.php" method="POST" class="card p-4 shadow">

    <div class="mb-2">
        <label>Nombre</label>
        <input type="text" class="form-control" name="nombre">
    </div>

    <div class="mb-2">
        <label>Correo</label>
        <input type="email" class="form-control" name="correo">
    </div>

    <div class="row">
        <div class="col">
            <label>Inicial</label>
            <input type="number" class="form-control" name="n1">
        </div>
        <div class="col">
            <label>Primera</label>
            <input type="number" class="form-control" name="n2">
        </div>
        <div class="col">
            <label>Segunda</label>
            <input type="number" class="form-control" name="n3">
        </div>
        <div class="col">
            <label>Tercera</label>
            <input type="number" class="form-control" name="n4">
        </div>
    </div>

    <button class="btn btn-primary mt-3">Enviar</button>

</form>

<script>
document.getElementById("formNotas").onsubmit = function(event) {
    let inputs = document.querySelectorAll("input[type='number']");
    for (let input of inputs) {
        let val = parseFloat(input.value);
        if (isNaN(val) || val < 0 || val > 10) {
            alert("Todos los valores deben estar entre 0 y 10");
            event.preventDefault();   // impedir envío
            return false;
        }
    }
};
</script>

</body>
</html>
