<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Notas con Progress Bar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2 class="text-center">Cálculo de Nota Final</h2>

<form id="formNotas" method="POST" action="notas_grafico.php" class="card p-4 shadow">

    <div class="row mb-3">
        <div class="col">
            <label class="form-label">Nota 1</label>
            <input type="number" name="n1" class="form-control" required min="0" max="10">
        </div>
        <div class="col">
            <label class="form-label">Nota 2</label>
            <input type="number" name="n2" class="form-control" required min="0" max="10">
        </div>
        <div class="col">
            <label class="form-label">Nota 3</label>
            <input type="number" name="n3" class="form-control" required min="0" max="10">
        </div>
        <div class="col">
            <label class="form-label">Nota 4</label>
            <input type="number" name="n4" class="form-control" required min="0" max="10">
        </div>
    </div>

    <button class="btn btn-primary w-100">Calcular</button>

</form>

<script>
// VALIDACIÓN JS
document.getElementById("formNotas").onsubmit = function (e) {
    let ok = true;
    document.querySelectorAll("input[type=number]").forEach(inp => {
        let v = parseFloat(inp.value);
        if (isNaN(v) || v < 0 || v > 10) ok = false;
    });

    if (!ok) {
        alert("Introduce valores entre 0 y 10");
        e.preventDefault();
    }
};
</script>

</body>
</html>
